# Builds the JRef Android APK (debug-signed, installable by hand) on GitHub's servers.
# Runs on every push to main, on tags v*, and on demand (Actions > "Android APK" > Run workflow).
# The APK is under "Artifacts" of the finished run (about 30-45 minutes the first time, faster with the cache).
# Tool versions follow the buildozer installation guide for Ubuntu 24.04 (JDK 17, Cython 0.29.34).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages needed by python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake autopoint libtool libtool-bin pkg-config cmake gettext \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 libffi-dev libssl-dev libltdl-dev \
            build-essential ccache

      - name: Core tests (the code that goes into the APK)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx Unidecode pypdf PyMuPDF "bibtexparser>=2.0.0b7"
          python -m pytest tests/test_core.py tests/test_sync.py tests/test_query.py -q

      - name: Buildozer
        run: python -m pip install buildozer setuptools "cython==0.29.34"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-24.04-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-24.04-

      - name: Build the APK
        # Licences are accepted by buildozer.spec (android.accept_sdk_license); stdin is closed so nothing can wait
        # for an answer. The log is kept for the artifact uploaded on failure.
        run: |
          set +o pipefail
          buildozer -v android debug < /dev/null 2>&1 | tee buildozer.log
          exit "${PIPESTATUS[0]}"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: JRef-android-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload the build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
